<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Look Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Game Look Lab</h1>

    <div class="layout">
        <div class="preview-column">
            <div class="preview-frame">
                <canvas id="glCanvas"></canvas>
                <p id="placeholder">Upload an image to preview it here.</p>
            </div>

            <label class="button file-button">
                Upload Image
                <input id="imageInput" type="file" accept="image/*">
            </label>
        </div>

        <div class="controls">
            <label>
                <span class="control-heading">
                    <span>Brightness</span>
                    <span id="brightnessValue">0.00</span>
                </span>
                <input id="brightness" type="range" min="-1" max="1" step="0.01" value="0">
            </label>

            <label>
                <span class="control-heading">
                    <span>Contrast</span>
                    <span id="contrastValue">1.00</span>
                </span>
                <input id="contrast" type="range" min="0" max="2" step="0.01" value="1">
            </label>

            <label>
                <span class="control-heading">
                    <span>Saturation</span>
                    <span id="saturationValue">1.00</span>
                </span>
                <input id="saturation" type="range" min="0" max="2" step="0.01" value="1">
            </label>

            <button id="reset" type="button">Reset</button>
        </div>
    </div>

    <p id="status" role="status"></p>

    <script type="module" src="js/main.js"></script>
</body>
</html>
