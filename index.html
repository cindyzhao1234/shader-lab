<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Look Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Game Look Lab</h1>
    <p class="lesson-link"><a href="triangle.html">Triangle lesson</a> · <a href="cube.html">Cube lesson</a></p>

    <div class="layout">
        <div class="preview-column">
            <div class="preview-frame">
                <canvas id="glCanvas"></canvas>
                <p id="placeholder">Upload an image to preview it here.</p>
            </div>

            <label class="button file-button">
                Upload Image
                <input id="imageInput" type="file" accept="image/*">
            </label>
        </div>

        <div class="controls">
            <div class="look-select">
                <span class="control-heading">Look</span>
                <div class="look-options">
                    <button type="button" id="lookOriginal" class="look-button" aria-pressed="false">Original</button>
                    <button type="button" id="lookCartoon" class="look-button is-selected" aria-pressed="true">Cartoon</button>
                </div>
            </div>

            <label>
                <span class="control-heading">
                    <span>Brightness</span>
                    <span id="brightnessValue">0.00</span>
                </span>
                <input id="brightness" type="range" min="-1" max="1" step="0.01" value="0">
            </label>

            <label>
                <span class="control-heading">
                    <span>Contrast</span>
                    <span id="contrastValue">1.00</span>
                </span>
                <input id="contrast" type="range" min="0" max="2" step="0.01" value="1">
            </label>

            <label>
                <span class="control-heading">
                    <span>Saturation</span>
                    <span id="saturationValue">1.00</span>
                </span>
                <input id="saturation" type="range" min="0" max="2" step="0.01" value="1">
            </label>

            <div id="cartoonControls">
                <label>
                    <span class="control-heading">
                        <span>Colour Levels</span>
                        <span id="colorLevelsValue">32</span>
                    </span>
                    <input id="colorLevels" type="range" min="2" max="32" step="1" value="32">
                </label>

                <label>
                    <span class="control-heading">
                        <span>Edge Threshold</span>
                        <span id="edgeThresholdValue">0.15</span>
                    </span>
                    <input id="edgeThreshold" type="range" min="0.01" max="0.5" step="0.01" value="0.15">
                </label>

                <label>
                    <span class="control-heading">
                        <span>Outline Thickness</span>
                        <span id="outlineThicknessValue">1</span>
                    </span>
                    <input id="outlineThickness" type="range" min="1" max="5" step="1" value="1">
                </label>
            </div>

            <button id="reset" type="button">Reset</button>
        </div>
    </div>

    <p id="status" role="status"></p>

    <script type="module" src="js/main.js"></script>
</body>
</html>
